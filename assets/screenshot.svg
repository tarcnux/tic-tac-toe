<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#f7f7f7"/>
  <!-- grid -->
  <g stroke="#333" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="400" y1="40" x2="400" y2="360" />
    <line x1="50" y1="140" x2="550" y2="140" />
    <line x1="50" y1="260" x2="550" y2="260" />
  </g>
  <!-- X's -->
  <g stroke="#d9534f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <line x1="80" y1="70" x2="170" y2="150" />
    <line x1="170" y1="70" x2="80" y2="150" />

    <line x1="320" y1="70" x2="410" y2="150" />
    <line x1="410" y1="70" x2="320" y2="150" />

    <line x1="80" y1="270" x2="170" y2="350" />
    <line x1="170" y1="270" x2="80" y2="350" />
  </g>
  <!-- O's -->
  <g stroke="#337ab7" stroke-width="10" fill="none">
    <circle cx="310" cy="260" r="45" />
    <circle cx="490" cy="160" r="45" />
  </g>
  <!-- caption -->
  <text x="50" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555">Exemplo de screenshot (substitua por uma imagem real)</text>
</svg>
