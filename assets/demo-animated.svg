<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#333" stroke-width="4">
    <line x1="160" y1="20" x2="160" y2="220" />
    <line x1="320" y1="20" x2="320" y2="220" />
    <line x1="40" y1="80" x2="440" y2="80" />
    <line x1="40" y1="160" x2="440" y2="160" />
  </g>

  <g id="X" stroke="#d9534f" stroke-width="10" stroke-linecap="round" transform="translate(30,20)">
    <line x1="20" y1="20" x2="100" y2="100" />
    <line x1="100" y1="20" x2="20" y2="100" />
  </g>

  <g id="O" stroke="#337ab7" stroke-width="8" fill="none" transform="translate(170,20)">
    <circle cx="60" cy="60" r="40" />
  </g>

  <g id="frame" font-family="Arial" font-size="14" fill="#444">
    <text x="10" y="235">Demo animado (substitua por GIF real em assets/demo.gif)</text>
  </g>

  <animate xlink:href="#X" attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite" />
  <animate xlink:href="#O" attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
</svg>
