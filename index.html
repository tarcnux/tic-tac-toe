<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Jogo da Velha</h1>
  
  <!-- Tela de Seleção de Modo -->
  <div id="modeSelection" class="container">
    <h2>Escolha o modo de jogo</h2>
    <div class="button-group">
      <button id="twoPlayersBtn" class="mode-btn">👥 Dois Jogadores</button>
      <button id="vsComputerBtn" class="mode-btn">🤖 Jogar contra IA</button>
    </div>
  </div>

  <!-- Tela do Jogo -->
  <div id="game" class="hidden">
    <p id="gameMode"></p>
    <div class="board">
      <div class="cell" data-row="0" data-col="0"></div>
      <div class="cell" data-row="0" data-col="1"></div>
      <div class="cell" data-row="0" data-col="2"></div>
      <div class="cell" data-row="1" data-col="0"></div>
      <div class="cell" data-row="1" data-col="1"></div>
      <div class="cell" data-row="1" data-col="2"></div>
      <div class="cell" data-row="2" data-col="0"></div>
      <div class="cell" data-row="2" data-col="1"></div>
      <div class="cell" data-row="2" data-col="2"></div>
    </div>
    <div id="status"></div>
    <div class="controls">
      <button id="restart">Reiniciar Jogo</button>
      <button id="selectMode">Selecionar Modo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
